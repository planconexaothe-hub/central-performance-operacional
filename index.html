<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Performance Operacional</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      position: relative;
    }

    .page1 {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .quadro_login {
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      animation: fadeIn 0.8s ease-out;
    }

    .header-logo {
      text-align: center;
      margin-bottom: 5px;
    }

    .header-logo i {
      font-size: 38px;
      color: #2563eb;
      margin-bottom: 8px;
      display: inline-block;
    }

    .quadro_login h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 0.5px;
      margin: 0;
      text-transform: uppercase;
      text-align: center;
    }

    .quadro_login p {
      font-size: 13px;
      color: #64748b;
      margin: 4px 0 10px 0;
    }

    .input-group-custom {
      position: relative;
      width: 100%;
    }

    .input-group-custom .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 18px;
      transition: color 0.3s;
      z-index: 2;
    }

    .input-group-custom .toggle-password {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 18px;
      cursor: pointer;
      z-index: 2;
    }

    .input-group-custom input {
      width: 100%;
      padding: 14px 45px 14px 48px;
      font-size: 15px;
      color: #1e293b;
      background-color: rgba(255, 255, 255, 0.9);
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group-custom input::placeholder {
      color: #94a3b8;
    }

    .input-group-custom input:focus {
      border-color: #2563eb;
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .input-group-custom input:focus + .input-icon {
      color: #2563eb;
    }

    .login-button {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }

    .login-button:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
    }

    .Botão_Registrar {
      width: 100%;
      background: rgba(255, 255, 255, 0.6);
      color: #059669;
      padding: 12px;
      border: 1.5px solid #10b981;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .Botão_Registrar:hover {
      background: #10b981;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .divider {
      width: 100%;
      display: flex;
      align-items: center;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      margin: 2px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #cbd5e1;
    }

    .divider span {
      padding: 0 10px;
    }

    .copyright-footer {
      position: fixed;
      bottom: 15px;
      right: 20px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      z-index: 999;
      pointer-events: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

<div id="page1" class="page1">
  <div class="quadro_login">
    
    <div class="header-logo">
      <i class="bi bi-bar-chart-line-fill"></i>
      <h1>Central de Performance Operacional</h1>
      <p>Acesse sua conta para continuar</p>
    </div>
    
    <div class="input-group-custom">
      <i class="bi bi-person input-icon"></i>
      <input type="text" id="usuario" placeholder="Usuário" autocomplete="off"/>
    </div>
    
    <div class="input-group-custom">
      <i class="bi bi-lock input-icon"></i>
      <input type="password" id="senha" placeholder="Senha" onkeypress="checkEnter(event)"/>
      <i class="bi bi-eye toggle-password" id="toggleIcon" onclick="toggleSenha()"></i>
    </div>
    
    <button onclick="realizarLogin()" class="login-button">
      Entrar <i class="bi bi-arrow-right-short" style="font-size: 20px;"></i>
    </button>
    
    <div class="divider">
      <span>ou</span>
    </div>

    <button type="button" class="Botão_Registrar" onclick="abrirCadastro()">
      <i class="bi bi-person-plus-fill"></i> Criar Login e Senha
    </button>
    
  </div>
</div>

<div class="copyright-footer">
  Copyright by Stéphison Gray
</div>

<script>
  const urlAppsScript = "https://script.google.com/macros/s/AKfycbw1zrWYq6IberycbODjwNAV8-yQIN74Pt2BrtlzC-aSx_g3J9vNvDEXzWYPnA4JGwfoNg/exec";

  function toggleSenha() {
    const inputSenha = document.getElementById('senha');
    const toggleIcon = document.getElementById('toggleIcon');
    
    if (inputSenha.type === 'password') {
      inputSenha.type = 'text';
      toggleIcon.classList.remove('bi-eye');
      toggleIcon.classList.add('bi-eye-slash');
    } else {
      inputSenha.type = 'password';
      toggleIcon.classList.remove('bi-eye-slash');
      toggleIcon.classList.add('bi-eye');
    }
  }

  function abrirCadastro() {
    window.open('https://script.google.com/macros/s/AKfycbzKJhrTzSiFCjUhHkJnWYDRVoQBPbevq0k3rdMWEjB9xpXm3ShwDftEwr-fSl-lO1Rucg/exec', '_blank');
  }

  function realizarLogin() {
    const user = document.getElementById('usuario').value.trim();
    const pass = document.getElementById('senha').value.trim();

    if (!user || !pass) {
      Swal.fire({
        icon: 'warning',
        title: 'Atenção',
        text: 'Por favor, preencha o usuário e a senha!',
        confirmButtonColor: '#2563eb'
      });
      return;
    }

    Swal.fire({
      title: 'Autenticando...',
      text: 'Aguarde um instante',
      allowOutsideClick: false,
      didOpen: () => {
        Swal.showLoading();
      }
    });

    // Redireciona de forma limpa para a aplicação principal
    setTimeout(() => {
      window.location.href = urlAppsScript;
    }, 1000);
  }

  function checkEnter(event) {
    if (event.key === 'Enter') {
      realizarLogin();
    }
  }
</script>

</body>
</html>
