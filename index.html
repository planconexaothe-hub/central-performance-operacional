<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Performance Operacional</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #0f172a; }

    .login-wrapper {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .quadro_login {
      width: 100%; max-width: 420px; padding: 40px 30px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }

    .header-logo { text-align: center; margin-bottom: 5px; }
    .header-logo i { font-size: 38px; color: #2563eb; margin-bottom: 8px; display: inline-block; }
    .quadro_login h1 { font-size: 20px; font-weight: 700; color: #0f172a; margin: 0; text-transform: uppercase; text-align: center; }
    .quadro_login p { font-size: 13px; color: #64748b; margin: 4px 0 10px 0; }
    
    .input-group-custom { position: relative; width: 100%; }
    .input-group-custom .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 18px; z-index: 2; }
    .input-group-custom .toggle-password { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 18px; cursor: pointer; z-index: 2; }
    
    .input-group-custom input {
      width: 100%; padding: 14px 45px 14px 48px; font-size: 15px; color: #1e293b;
      background-color: rgba(255, 255, 255, 0.9); border: 1.5px solid #cbd5e1; border-radius: 14px; outline: none;
    }
    .input-group-custom input:focus { border-color: #2563eb; background-color: #ffffff; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15); }
    
    .login-button {
      width: 100%; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #ffffff;
      padding: 14px; border: none; border-radius: 14px; font-weight: 600; font-size: 15px; cursor: pointer;
      display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 5px;
    }
    .login-button:hover { background: linear-gradient(135deg, #1d4ed8, #1e40af); transform: translateY(-2px); }
    
    .Botão_Registrar {
      width: 100%; background: rgba(255, 255, 255, 0.6); color: #059669; padding: 12px;
      border: 1.5px solid #10b981; border-radius: 14px; font-weight: 600; cursor: pointer; font-size: 14px;
      display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    
    .divider { width: 100%; display: flex; align-items: center; text-align: center; color: #94a3b8; font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #cbd5e1; }
    .divider span { padding: 0 10px; }
    
    .copyright-footer { position: fixed; bottom: 15px; right: 20px; color: rgba(255, 255, 255, 0.7); font-size: 12px; font-weight: 500; z-index: 999; pointer-events: none; }

    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 5;
    }
  </style>
</head>
<body>

<div id="loginWrapper" class="login-wrapper">
  <div class="quadro_login">
    <div class="header-logo">
      <i class="bi bi-bar-chart-line-fill"></i>
      <h1>Central de Performance Operacional</h1>
      <p>Acesse sua conta para continuar</p>
    </div>
    
    <div class="input-group-custom">
      <i class="bi bi-person input-icon"></i>
      <input type="text" id="usuario" placeholder="Usuário" autocomplete="off"/>
    </div>
    
    <div class="input-group-custom">
      <i class="bi bi-lock input-icon"></i>
      <input type="password" id="senha" placeholder="Senha" onkeypress="checkEnter(event)"/>
      <i class="bi bi-eye toggle-password" id="toggleIcon" onclick="toggleSenha()"></i>
    </div>
    
    <button onclick="entrarSistema()" class="login-button">
      Entrar <i class="bi bi-arrow-right-short" style="font-size: 20px;"></i>
    </button>
    
    <div class="divider"><span>ou</span></div>

    <button type="button" class="Botão_Registrar" onclick="abrirCadastro()">
      <i class="bi bi-person-plus-fill"></i> Criar Login e Senha
    </button>
  </div>
</div>

<iframe id="appFrame" src="about:blank"></iframe>

<div class="copyright-footer">Copyright by Stéphison Gray</div>

<script>
  const urlIndexAppsScript = "https://script.google.com/macros/s/AKfycbwksudU5-qTxv0mLoKRaNWQkkqf9Pjxj4CHdE47V71z9Pu41LgJMO7XyyUoiV4WTj_h/exec";

  // Tratamento de Logout ou Recuperação de Sessão
  const urlParams = new URLSearchParams(window.location.search);
  const isLogout = urlParams.get('logout');

  if (isLogout) {
    localStorage.removeItem('cpo_usuario');
    localStorage.clear();
    sessionStorage.clear();
    window.history.replaceState({}, document.title, window.location.pathname);
  } else {
    const userIdUrl = urlParams.get('id');
    const usuarioSalvo = localStorage.getItem('cpo_usuario');

    if (userIdUrl || usuarioSalvo) {
      const idParaUsar = userIdUrl || usuarioSalvo;
      localStorage.setItem('cpo_usuario', idParaUsar);
      document.write('<style>#loginWrapper { display: none !important; }</style>');
    }
  }

  window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    if (!params.get('logout')) {
      const usuarioSalvo = localStorage.getItem('cpo_usuario');
      if (usuarioSalvo) {
        carregarPainelNoIframe(usuarioSalvo);
      }
    }
  };

  function toggleSenha() {
    const inputSenha = document.getElementById('senha');
    const toggleIcon = document.getElementById('toggleIcon');
    if (inputSenha.type === 'password') {
      inputSenha.type = 'text';
      toggleIcon.classList.remove('bi-eye');
      toggleIcon.classList.add('bi-eye-slash');
    } else {
      inputSenha.type = 'password';
      toggleIcon.classList.remove('bi-eye-slash');
      toggleIcon.classList.add('bi-eye');
    }
  }

  function abrirCadastro() {
    window.open('https://script.google.com/macros/s/AKfycbzKJhrTzSiFCjUhHkJnWYDRVoQBPbevq0k3rdMWEjB9xpXm3ShwDftEwr-fSl-lO1Rucg/exec', '_blank');
  }

  function entrarSistema() {
    const userInput = document.getElementById('usuario');
    const passInput = document.getElementById('senha');

    if (!userInput || !passInput) return;

    const user = userInput.value.trim();
    const pass = passInput.value.trim();

    if (!user || !pass) {
      Swal.fire({ icon: 'warning', title: 'Atenção', text: 'Preencha o usuário e a senha!' });
      return;
    }

    Swal.fire({
      title: 'Carregando...',
      text: 'Autenticando na Central de Performance...',
      allowOutsideClick: false,
      didOpen: () => { Swal.showLoading(); }
    });

    localStorage.setItem('cpo_usuario', user);
    carregarPainelNoIframe(user);
  }

  function carregarPainelNoIframe(user) {
    const iframe = document.getElementById('appFrame');
    iframe.src = urlIndexAppsScript + "?id=" + encodeURIComponent(user);

    iframe.onload = function() {
      Swal.close();
      document.getElementById('loginWrapper').style.display = 'none';
    };
  }

  function checkEnter(event) {
    if (event.key === 'Enter') entrarSistema();
  }
</script>

</body>
</html>
