<!DOCTYPE html>
<html lang="pt-br">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Performance Operacional</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Gradiente moderno e escuro para alto contraste */
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      position: relative;
    }

    /* Tela principal */
    .page1 {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Cartão de Login - Glassmorphism moderno */
    .quadro_login {
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      animation: fadeIn 0.8s ease-out;
    }

    /* Cabeçalho e Título */
    .header-logo {
      text-align: center;
      margin-bottom: 5px;
    }

    .header-logo i {
      font-size: 38px;
      color: #2563eb;
      margin-bottom: 8px;
      display: inline-block;
    }

    .quadro_login h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 0.5px;
      margin: 0;
      text-transform: uppercase;
      text-align: center;
    }

    .quadro_login p {
      font-size: 13px;
      color: #64748b;
      margin: 4px 0 10px 0;
    }

    /* Estilização dos Inputs com Ícones integrados */
    .input-group-custom {
      position: relative;
      width: 100%;
    }

    .input-group-custom .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 18px;
      transition: color 0.3s;
      z-index: 2;
    }

    .input-group-custom .toggle-password {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 18px;
      cursor: pointer;
      z-index: 2;
    }

    .input-group-custom input {
      width: 100%;
      padding: 14px 45px 14px 48px;
      font-size: 15px;
      color: #1e293b;
      background-color: rgba(255, 255, 255, 0.9);
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group-custom input::placeholder {
      color: #94a3b8;
    }

    .input-group-custom input:focus {
      border-color: #2563eb;
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .input-group-custom input:focus + .input-icon {
      color: #2563eb;
    }

    /* Botões */
    .login-button {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }

    .login-button:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
    }

    .Botão_Registrar {
      width: 100%;
      background: rgba(255, 255, 255, 0.6);
      color: #059669;
      padding: 12px;
      border: 1.5px solid #10b981;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .Botão_Registrar:hover {
      background: #10b981;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    /* Divisor */
    .divider {
      width: 100%;
      display: flex;
      align-items: center;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      margin: 2px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #cbd5e1;
    }

    .divider span {
      padding: 0 10px;
    }

    /* Copyright no canto inferior direito */
    .copyright-footer {
      position: fixed;
      bottom: 15px;
      right: 20px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      z-index: 999;
      pointer-events: none;
    }

    /* Animação Suave ao Carregar */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

<div id="page1" class="page1">
  <div class="quadro_login">
    
    <div class="header-logo">
      <i class="bi bi-bar-chart-line-fill"></i>
      <h1>Central de Performance Operacional</h1>
      <p>Acesse sua conta para continuar</p>
    </div>
    
    <!-- Campo de Usuário com Ícone -->
    <div class="input-group-custom">
      <i class="bi bi-person input-icon"></i>
      <input type="text" id="usuario" placeholder="Usuário" autocomplete="off"/>
    </div>
    
    <!-- Campo de Senha com Ícone e Alternar Visualização -->
    <div class="input-group-custom">
      <i class="bi bi-lock input-icon"></i>
      <input type="password" id="senha" placeholder="Senha" onkeypress="checkEnter(event)"/>
      <i class="bi bi-eye toggle-password" id="toggleIcon" onclick="toggleSenha()"></i>
    </div>
    
    <!-- Botão Principal de Login -->
    <button onclick="LoginUser()" class="login-button">
      Entrar <i class="bi bi-arrow-right-short" style="font-size: 20px;"></i>
    </button>
    
    <div class="divider">
      <span>ou</span>
    </div>

    <!-- Botão de Cadastro -->
    <button type="button" class="Botão_Registrar" onclick="abrirCadastro()">
      <i class="bi bi-person-plus-fill"></i> Criar Login e Senha
    </button>
    
  </div>
</div>

<!-- Copyright no canto inferior direito -->
<div class="copyright-footer">
  Copyright by Stéphison Gray
</div>

  <script>

    // Função para mostrar/ocultar senha
  function toggleSenha() {
    const inputSenha = document.getElementById('senha');
    const toggleIcon = document.getElementById('toggleIcon');
    
    if (inputSenha.type === 'password') {
      inputSenha.type = 'text';
      toggleIcon.classList.remove('bi-eye');
      toggleIcon.classList.add('bi-eye-slash');
    } else {
      inputSenha.type = 'password';
      toggleIcon.classList.remove('bi-eye-slash');
      toggleIcon.classList.add('bi-eye');
    }
  }


    function mostrarPop(titulo, texto, icone) {
      Swal.fire({
        title: titulo,
        text: texto,
        icon: icone, 
        confirmButtonColor: '#1a4d89',
        confirmButtonText: 'OK'
      });
    }

    function abrirCadastro() {
      // Abre a tela de cadastro limpando heranças de iframe para evitar o erro de recusa de conexão
      window.open('https://script.google.com/macros/s/AKfycbzKJhrTzSiFCjUhHkJnWYDRVoQBPbevq0k3rdMWEjB9xpXm3ShwDftEwr-fSl-lO1Rucg/exec', '_blank');
    }

    function LoginUser() {
      const user = document.getElementById("usuario").value.trim();
      const pass = document.getElementById("senha").value.trim();
      const btn = document.querySelector(".login-button");

      if (!user || !pass) {
        mostrarPop('Campos Vazios', 'Por favor, digite seu usuário e senha.', 'warning');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Autenticando...';

      google.script.run
        .withSuccessHandler(function(resp) {
          if (resp && resp.success === "TRUE") {
            Swal.fire({
              title: 'Sucesso!',
              text: 'Acesso autorizado. Redirecionando...',
              icon: 'success',
              timer: 1500,
              showConfirmButton: false
            });
            
            if (resp.proximaUrl) {
              window.top.location.href = resp.proximaUrl;
            } else {
              mostrarPop('Erro de Rota', 'URL de destino não encontrada.', 'error');
              resetBtn(btn);
            }

          } else if (resp.success === "BLOQUEADO") {
            mostrarPop('Acesso Bloqueado', resp.mensagem, 'error');
            resetBtn(btn);
          } else {
            let msg = resp.mensagem;
            if(resp.tentativasRestantes !== undefined) {
              msg += ` Você ainda tem ${resp.tentativasRestantes} tentativa(s).`;
            }
            mostrarPop('Erro de Autenticação', msg, 'error');
            resetBtn(btn);
          }
        })
        .withFailureHandler(function(err) {
          console.error(err);
          mostrarPop('Erro no Servidor', 'Falha crítica na comunicação.', 'error');
          resetBtn(btn);
        })
        .checkLogin(user, pass);
    }

    function resetBtn(btn) {
      btn.disabled = false;
      btn.innerHTML = 'Login';
    }

    function checkEnter(event) {
      if (event.key === 'Enter') LoginUser();
    }

    Swal.fire({
      icon: 'info',
      title: 'Aviso',
      text: 'Para conectar ao banco de dados do Apps Script diretamente, certifique-se de chamar a função do seu backend.'
    });
  }
  </script>
</body>
</html>
